AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudShop ingress and analytics: internal ALB, five target groups, API Gateway
  HTTP API with a VPC Link, Glue Data Catalog crawler and Athena workgroup.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Existing stacks
        Parameters:
          - FoundationStackName
          - ComputeStackName
      - Label:
          default: Application
        Parameters:
          - ProjectName
          - FrontendOrigin
      - Label:
          default: AWS Academy
        Parameters:
          - GlueRoleName

Parameters:
  FoundationStackName:
    Type: String
    Default: cloudshop-foundation
  ComputeStackName:
    Type: String
    Default: cloudshop-compute
  ProjectName:
    Type: String
    Default: cloudshop
    AllowedPattern: '[a-z][a-z0-9-]{2,20}'
  FrontendOrigin:
    Type: String
    Default: https://main.d1hnxbe1zwqmow.amplifyapp.com
    AllowedPattern: 'https://.+'
  GlueRoleName:
    Type: String
    Default: LabRole
    Description: Existing AWS Academy role used by the Glue crawler.

Resources:
  UsersTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-users'
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Targets:
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance1Id'
          Port: 8000
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance2Id'
          Port: 8000

  CatalogTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-catalog'
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Targets:
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance1Id'
          Port: 8080
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance2Id'
          Port: 8080

  AnalyticsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-analytics'
      Port: 8001
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Targets:
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance1Id'
          Port: 8001
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance2Id'
          Port: 8001

  SalesTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-sales'
      Port: 8002
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Targets:
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance1Id'
          Port: 8002
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance2Id'
          Port: 8002

  OrdersTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-orders'
      Port: 8003
      Protocol: HTTP
      TargetType: instance
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Targets:
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance1Id'
          Port: 8003
        - Id:
            Fn::ImportValue: !Sub '${ComputeStackName}-AppInstance2Id'
          Port: 8003

  InternalLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-internal-alb'
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue: !Sub '${FoundationStackName}-AlbSecurityGroupId'
      Subnets:
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetAId'
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetBId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-internal-alb'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"detail":"route not found"}'
            StatusCode: '404'

  SalesByUserRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /usuarios/*/ventas
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SalesTargetGroup

  ReviewsByProductRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /productos/*/resenas
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SalesTargetGroup

  UsersRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 30
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /usuarios
              - /usuarios/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref UsersTargetGroup

  CatalogRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 40
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/catalogo
              - /api/catalogo/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CatalogTargetGroup

  SalesRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 50
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /ventas
              - /ventas/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SalesTargetGroup

  OrdersRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 60
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /ordenes/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref OrdersTargetGroup

  AnalyticsRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 70
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /analitica/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AnalyticsTargetGroup

  ApiVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub '${ProjectName}-vpc-link'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${FoundationStackName}-VpcLinkSecurityGroupId'
      SubnetIds:
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetAId'
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetBId'
      Tags:
        Project: !Ref ProjectName

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowOrigins:
          - !Ref FrontendOrigin
          - http://localhost:5173
        MaxAge: 600

  PrivateIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      ConnectionId: !Ref ApiVpcLink
      ConnectionType: VPC_LINK
      Description: CloudShop private ALB integration
      IntegrationMethod: ANY
      IntegrationType: HTTP_PROXY
      IntegrationUri: !Ref HttpListener
      PayloadFormatVersion: '1.0'
      RequestParameters:
        'overwrite:path': '$request.path'
      TimeoutInMillis: 29000

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'ANY /{proxy+}'
      Target: !Join
        - /
        - - integrations
          - !Ref PrivateIntegration

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'ANY /'
      Target: !Join
        - /
        - - integrations
          - !Ref PrivateIntegration

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cloudshop_analytics
        Description: CloudShop data lake catalog

  DataLakeCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${ProjectName}-data-lake-crawler'
      DatabaseName: !Ref GlueDatabase
      Description: Discovers the CSV and NDJSON datasets produced by CloudShop ingestion.
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GlueRoleName}'
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING
      SchemaChangePolicy:
        DeleteBehavior: LOG
        UpdateBehavior: UPDATE_IN_DATABASE
      Targets:
        S3Targets:
          - Path:
              Fn::Sub:
                - 's3://${BucketName}/'
                - BucketName:
                    Fn::ImportValue: !Sub '${FoundationStackName}-DataLakeBucketName'
            Exclusions:
              - athena-results/**

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: cloudshop-wg
      Description: CloudShop analytical queries
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
          OutputLocation:
            Fn::Sub:
              - 's3://${BucketName}/athena-results/'
              - BucketName:
                  Fn::ImportValue: !Sub '${FoundationStackName}-DataLakeBucketName'

Outputs:
  ApiEndpoint:
    Description: Set this value as VITE_API_BASE_URL in Amplify.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ApiId:
    Value: !Ref HttpApi
  InternalAlbDnsName:
    Value: !GetAtt InternalLoadBalancer.DNSName
  GlueDatabaseName:
    Value: !Ref GlueDatabase
  GlueCrawlerName:
    Value: !Ref DataLakeCrawler
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
